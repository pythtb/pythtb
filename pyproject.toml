[build-system]
requires = ["setuptools>=69", "setuptools_scm[toml]>=7.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythtb"
dynamic = ["version"]
description = "Solver for tight binding models in condensed matter physics and materials science."
readme = { file = "README.md", content-type = "text/markdown" } 
requires-python = ">=3.12"
authors = [
  { name = "Trey Cole", email = "trey@treycole.me" },
  { name = "Sinisa Coh", email = "sinisacoh@gmail.com" },
  { name = "David Vanderbilt", email = "dhv@physics.rutgers.edu" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"] 
keywords = ["physics", "tight binding", "solid state physics", "condensed matter physics", "materials science"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.9"
]

[project.optional-dependencies]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "myst-nb",
  "sphinxcontrib-programoutput",
  "nbconvert",
  "sphinx-design",
  "sphinx-gallery",
  "numpydoc",
  "sphinx-togglebutton",
  "sphinx-notfound-page"
]
tests = ["pytest"]
dev = [
  "pytest",
  "black",
  "pre-commit",
  "ruff",
  "nbstripout",
] 
plotting = [
  "plotly",
]
speedup = [
  "tensorflow"
]
notebooks = [
  "jupyter",
  "jupyterlab",
  "notebook>=7.0",
  "ipykernel",
  "ipython>=8.17",
]

[project.urls]
Homepage = "http://www.physics.rutgers.edu/pythtb"
Documentation = "https://pythtb.readthedocs.io/en/latest/"
Repository = "https://github.com/pythtb/pythtb"
Issues = "https://github.com/pythtb/pythtb/issues"
Changelog = "https://github.com/pythtb/pythtb/blob/main/CHANGELOG.md"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["pythtb*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  "docs/v1.8.0/**",
  "docs/source/examples/**",
  "docs/source/examples_py/**",
  "docs/.jupyter_cache/**",
]

[tool.ruff.lint.extend-per-file-ignores]
"pythtb/__init__.py" = ["E402", "F403"]
"tests/test_examples/**.py" = ["F403", "F405"]
"tests/test_visualize/**.py" = ["F403", "F405"]
"tests/test_w90/**.py" = ["F403", "F405"]
