[build-system]
requires = ["setuptools>=42", "setuptools_scm[toml]>=7.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythtb"
dynamic = ["version"]
description = "Solver for tight binding models in condensed matter physics and materials science."
readme = "README.md"  
requires-python = ">=3.12"
authors = [
  { name = "Trey Cole", email = "trey@treycole.me" },
  { name = "Sinisa Coh", email = "sinisacoh@gmail.com" },
  { name = "David Vanderbilt", email = "dhv@physics.rutgers.edu" }
]
license = { file = "LICENSE" } 
keywords = ["physics", "tight binding", "solid state physics", "condensed matter physics", "materials science"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.9"
]

[project.optional-dependencies]
docs = [
  "sphinx",
  "pydata-sphinx-theme",
  "sphinx-copybutton",
  "myst-nb",
  "sphinxcontrib-programoutput",
  "nbconvert",
  "sphinx_design",
  "sphinx_gallery",
  "numpydoc",
  "sphinx-togglebutton",
  "sphinx-notfound-page"
]
tests = ["pytest"]
dev = [
  "pytest",
  "black",
  "pre-commit",
  "ruff",
  "nbstripout",
] 
plotting = [
  "plotly",
]
speedup = [
  "tensorflow"
]
notebooks = [
  "jupyter",
  "jupyterlab",
  "notebook>=7.0",
  "ipykernel",
  "ipython>=8.17",
]

[project.urls]
"Homepage" = "http://www.physics.rutgers.edu/pythtb"
"Download" = "https://github.com/pythtb/pythtb"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["pythtb*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  "docs/v1.8.0/**",
  "docs/source/examples/**",
  "docs/source/examples_py/**",
  "docs/.jupyter_cache/**",
]

[tool.ruff.lint.extend-per-file-ignores]
"pythtb/__init__.py" = ["E402", "F403"]
"tests/test_examples/**.py" = ["F403", "F405"]
"tests/test_visualize/**.py" = ["F403", "F405"]
"tests/test_w90/**.py" = ["F403", "F405"]
